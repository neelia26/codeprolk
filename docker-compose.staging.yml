name: codeprolk-staging

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./backend/.env.staging}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ${STAGING_ENV_FILE:-./backend/.env.staging}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      - backend

volumes:
  staging_postgres_data:
